name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
          tofu_version: 1.13.8

      - name: fmt
        run: tofu fmt -check -recursive

      - name: init
        run: tofu init -backend=false

      - name: validate
        run: tofu validate

      - name: validate example
        working-directory: examples/basic
        run: |
          tofu init -backend=false
          tofu validate

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.65.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --no-color

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # tests/ uses mock_provider, which needs Terraform >= 1.7. The module
      # itself still only requires >= 1.5 — this pin is test-only.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
          terraform_version: 1.17.1

      - name: init
        run: terraform init -backend=false

      - name: test
        run: terraform test -no-color

  # The module claims a minimum azurerm version. Prove it, so an argument that
  # only exists in a newer provider cannot silently break consumers who resolve
  # the floor of the constraint.
  minimum-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
          tofu_version: 1.13.8

      - name: pin azurerm to the declared minimum and validate
        run: |
          cat > override.tf <<'EOF'
          terraform {
            required_providers {
              azurerm = {
                source  = "hashicorp/azurerm"
                version = "3.0.0"
              }
            }
          }
          EOF
          tofu init -backend=false -upgrade
          tofu validate
          tofu test
